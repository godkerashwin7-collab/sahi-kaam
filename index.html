<p id="aiStatus"></p>

<script>
async function aiSearch() {
  const input = document.getElementById("aiSearchBox").value;
  const statusEl = document.getElementById("aiStatus");
  statusEl.innerText = "Thinking...";

  try {
    const response = await fetch("https://ashwingodker--71945ff89cc7e.web.val.run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: input })
    });

    const data = await response.json();

    if (data.category) {
      window.location.href = data.category + ".html";
    } else {
      statusEl.innerText = "Hmm, couldn't understand. Try again?";
      console.log(data);
    }
  } catch (error) {
    statusEl.innerText = "Something went wrong. Try again.";
    console.log(error);
  }
}
