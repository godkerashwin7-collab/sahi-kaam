<h2>Or search directly</h2>
<input type="text" id="searchBox" placeholder="Type: plumber, electrician...">
<button onclick="searchService()">Search</button>

<script>
function searchService() {
  var input = document.getElementById("searchBox").value.toLowerCase();
  
  if (input.includes("plumb")) {
    window.location.href = "plumber.html";
  } else if (input.includes("electric")) {
    window.location.href = "electrician.html";
  } else if (input.includes("carpen")) {
    window.location.href = "carpenter.html";
  } else if (input.includes("paint")) {
    window.location.href = "painter.html";
  } else if (input.includes("clean")) {
    window.location.href = "cleaning.html";
  } else {
    alert("Sorry, we don't have that service yet!");
  }
}
</script>
