<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    padding: 20px;
  }
  h1 {
    color: #333;
  }
  a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 16px;
    margin: 10px 0;
    border-radius: 10px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
  }
  .plumber { background-color: #1e88e5; }
  .electrician { background-color: #fb8c00; }
  .carpenter { background-color: #6d4c41; }
  .painter { background-color: #8e24aa; }
  .cleaning { background-color: #00897b; }
</style>

<h1>Sahi Kaam</h1>
<p>Find trusted help near you in Mumbai.</p>

<h2>Choose a service</h2>
<a href="plumber.html" class="plumber">🔧 Plumber</a>
<a href="electrician.html" class="electrician">⚡ Electrician</a>
<a href="carpenter.html" class="carpenter">🪚 Carpenter</a>
<a href="painter.html" class="painter">🎨 Painter</a>
<a href="cleaning.html" class="cleaning">🧹 House Cleaning</a>

<h2>Or search directly</h2>
<input type="text" id="searchBox" placeholder="Type: plumber, electrician...">
<button onclick="searchService()">Search</button>

<script>
function searchService() {
  var input = document.getElementById("searchBox").value.toLowerCase();
  if (input.includes("plumb")) window.location.href = "plumber.html";
  else if (input.includes("electric")) window.location.href = "electrician.html";
  else if (input.includes("carpen")) window.location.href = "carpenter.html";
  else if (input.includes("paint")) window.location.href = "painter.html";
  else if (input.includes("clean")) window.location.href = "cleaning.html";
  else alert("Sorry, we don't have that service yet!");
}
</script>
