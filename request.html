<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Service — Sahi Kaamwala</title>
<script src="business-info.js"></script>
<link rel="stylesheet" href="verify.css">
<style>
  body { font-family: Arial, sans-serif; background-color: #f2f2f2; padding: 20px; }
  h1 { color: #0B3D91; }
  input, select {
    width: 100%; padding: 12px; font-size: 16px; margin: 8px 0;
    box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px;
  }
  button.sk-submit {
    width: 100%; padding: 14px; font-size: 18px; background-color: #0B3D91;
    color: white; border: none; border-radius: 8px; margin-top: 10px;
    font-weight: 800; font-style: italic;
    box-shadow: 0 4px 14px rgba(30,136,229,0.4);
  }
  #status { margin-top: 15px; font-weight: bold; }
  #whatsappCta {
    display: none;
    margin-top: 12px;
    text-align: center;
    background: #25D366;
    color: #fff;
    padding: 14px;
    border-radius: 8px;
    font-weight: 800;
    text-decoration: none;
  }
  #signedInAs {
    font-size: 13px;
    color: #2e7d32;
    font-weight: 600;
    margin: 4px 0 0;
  }
</style>
</head>
<body>
  <div class="tricolor-stripe" style="margin:-20px -20px 20px;"></div>

<h1>Request Help</h1>
<p>Tell us what you need and we'll connect you with someone.</p>
<p id="signedInAs"></p>

<input type="text" id="name" placeholder="Your Name">
<select id="skill">
  <option value="">What do you need?</option>
  <option value="plumber">Plumber</option>
  <option value="electrician">Electrician</option>
  <option value="carpenter">Carpenter</option>
  <option value="painter">Painter</option>
  <option value="cleaning">House Cleaning</option>
  <option value="other">Something else</option>
</select>
<input type="text" id="area" placeholder="Your Area (e.g. Bandra)">
<input type="tel" id="phone" placeholder="Your Phone Number">
<button type="button" class="sk-submit" onclick="submitRequest()">Send Request</button>
<p id="status"></p>
<a href="#" id="whatsappCta" target="_blank" rel="noopener">📲 Tap to notify us on WhatsApp</a>

<script src="auth.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, updateProfile, signOut, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxO3xbZTYPHXjMxCtdalD-efBG0hPe9b4",
    authDomain: "sahi-kaam-b32fa.firebaseapp.com",
    projectId: "sahi-kaam-b32fa",
    storageBucket: "sahi-kaam-b32fa.firebasestorage.app",
    messagingSenderId: "187530591485",
    appId: "1:187530591485:web:5f5973815c2b6ff5175294"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;

  SahiAuth.init({
    auth,
    fns: { onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut, sendPasswordResetEmail },
    onChange: (user) => {
      currentUser = user;
      const el = document.getElementById("signedInAs");
      if (user) {
        el.textContent = `Signed in as ${user.email}`;
        if (!document.getElementById("name").value && user.displayName) {
          document.getElementById("name").value = user.displayName;
        }
      } else {
        el.textContent = "";
      }
    }
  });

  // A real request needs a real, logged-in customer behind it — this is
  // what stops anonymous/fake submissions instead of just trusting whatever
  // name and number someone types in.
  window.submitRequest = async function() {
    if (!currentUser) {
      SahiAuth.open("login", () => window.submitRequest());
      return;
    }

    const name = document.getElementById("name").value.trim();
    const skill = document.getElementById("skill").value;
    const area = document.getElementById("area").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const statusEl = document.getElementById("status");

    if (!name || !skill || !area || !phone) {
      statusEl.innerText = "Please fill all fields.";
      statusEl.style.color = "red";
      return;
    }

    if (!/^[6-9]\d{9}$/.test(phone.replace(/\D/g, "").slice(-10))) {
      statusEl.innerText = "Please enter a valid 10-digit Indian mobile number.";
      statusEl.style.color = "red";
      return;
    }

    try {
      await addDoc(collection(db, "customer_requests"), {
        name, skill, area, phone,
        uid: currentUser.uid,
        accountEmail: currentUser.email,
        submittedAt: new Date().toISOString()
      });
      statusEl.innerText = "✅ Request saved! We'll contact you soon.";
      statusEl.style.color = "green";

      // Show a real, tappable WhatsApp link instead of trying to open one
      // automatically — mobile browsers routinely block window.open() calls
      // that happen after an `await` (like this database save), since by
      // then it's no longer considered a direct result of the tap. That
      // silent failure was exactly why requests seemed to "go nowhere."
      const waNumber = (window.SAHI_BUSINESS && window.SAHI_BUSINESS.whatsappNumber) || "";
      const waCta = document.getElementById("whatsappCta");
      if (waNumber && waNumber.indexOf("REPLACE_ME") === -1) {
        const msg = `🔔 New service request on Sahi Kaamwala\nName: ${name}\nNeeds: ${skill}\nArea: ${area}\nPhone: ${phone}`;
        waCta.href = "https://wa.me/" + waNumber + "?text=" + encodeURIComponent(msg);
        waCta.style.display = "block";
      } else {
        console.warn("SAHI_BUSINESS.whatsappNumber is not set — fill it in business-info.js.");
      }
    } catch (error) {
      statusEl.innerText = "Something went wrong. Try again.";
      statusEl.style.color = "red";
      console.log(error);
    }
  }
</script>
</body>
</html>
