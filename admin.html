<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Sahi Kaamwala</title>
<script src="business-info.js"></script>
<link rel="stylesheet" href="verify.css">
<style>
  body { font-family: Arial, sans-serif; background-color: #f2f2f2; padding: 0; margin: 0; }
  .tricolor-stripe{ height:5px; width:100%; background: linear-gradient(90deg, #FF9933 0 33.33%, #fff 33.33% 66.66%, #138808 66.66% 100%); }
  header { background:#0B3D91; color:#fff; padding:16px 18px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; font-size:12px; color:#C9D2E3; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  #gate { text-align:center; padding: 60px 20px; }
  #gate p { color:#555; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px; }
  .tab-btn {
    flex:0 0 auto; padding:9px 14px; border-radius:20px; border:1px solid #ddd;
    background:#fff; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .tab-btn.active { background:#0B3D91; color:#fff; border-color:#0B3D91; }
  .panel { display:none; }
  .panel.active { display:block; }
  .item-card {
    background:#fff; border-radius:12px; padding:14px; margin-bottom:10px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08); font-size:13.5px;
  }
  .item-row { display:flex; justify-content:space-between; gap:8px; margin:3px 0; }
  .item-row strong { color:#0B3D91; }
  .item-actions { display:flex; gap:8px; margin-top:10px; }
  .item-actions button {
    flex:1; padding:8px; border-radius:8px; border:none; font-weight:700; font-size:12.5px; cursor:pointer;
  }
  .btn-approve { background:#138808; color:#fff; }
  .btn-reject { background:#c62828; color:#fff; }
  .btn-delete { background:#eee; color:#c62828; }
  .status-tag { font-size:11px; font-weight:800; padding:3px 8px; border-radius:10px; }
  .status-pending { background:#FFF3E0; color:#E6821A; }
  .status-approved { background:#E8F5E9; color:#138808; }
  .status-rejected { background:#FFEBEE; color:#c62828; }
  .empty-msg { color:#888; text-align:center; padding:24px 0; font-size:13.5px; }
  #signedInAs { font-size:12px; color:#C9D2E3; }
</style>
</head>
<body>
  <div class="tricolor-stripe"></div>
  <header>
    <h1>🛡️ Admin Dashboard</h1>
    <p id="signedInAs">Sahi Kaamwala</p>
  </header>

  <div id="gate" class="wrap">
    <p>Checking access…</p>
  </div>

  <div id="dashboard" class="wrap" style="display:none;">
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="bookings">📋 Bookings</button>
      <button type="button" class="tab-btn" data-tab="workers">🛠️ Worker Applications</button>
      <button type="button" class="tab-btn" data-tab="feedback">💬 Feedback</button>
      <button type="button" class="tab-btn" data-tab="reviews">⭐ Reviews</button>
      <button type="button" class="tab-btn" data-tab="donations">❤️ Donations</button>
      <button type="button" class="tab-btn" data-tab="showcase">🏠 Showcase Posts</button>
    </div>

    <div id="panel-bookings" class="panel active"><p class="empty-msg">Loading…</p></div>
    <div id="panel-workers" class="panel"><p class="empty-msg">Loading…</p></div>
    <div id="panel-feedback" class="panel"><p class="empty-msg">Loading…</p></div>
    <div id="panel-reviews" class="panel"><p class="empty-msg">Loading…</p></div>
    <div id="panel-donations" class="panel"><p class="empty-msg">Loading…</p></div>
    <div id="panel-showcase" class="panel"><p class="empty-msg">Loading…</p></div>
  </div>

<script src="auth.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, updateProfile, signOut, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc, query, orderBy, limit
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxO3xbZTYPHXjMxCtdalD-efBG0hPe9b4",
    authDomain: "sahi-kaam-b32fa.firebaseapp.com",
    projectId: "sahi-kaam-b32fa",
    storageBucket: "sahi-kaam-b32fa.firebasestorage.app",
    messagingSenderId: "187530591485",
    appId: "1:187530591485:web:5f5973815c2b6ff5175294"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;
  let isAdmin = false;

  SahiAuth.init({
    auth,
    fns: { onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut, sendPasswordResetEmail },
    onChange: async (user) => {
      currentUser = user;
      const gate = document.getElementById("gate");
      const dashboard = document.getElementById("dashboard");

      if (!user) {
        gate.style.display = "block";
        dashboard.style.display = "none";
        gate.innerHTML = `<p>Please log in with an admin account.</p>`;
        SahiAuth.open("login");
        return;
      }

      document.getElementById("signedInAs").textContent = `Signed in as ${user.email}`;

      try {
        const adminSnap = await getDoc(doc(db, "admins", user.uid));
        isAdmin = adminSnap.exists();
      } catch (err) {
        isAdmin = false;
      }

      if (!isAdmin) {
        gate.style.display = "block";
        dashboard.style.display = "none";
        gate.innerHTML = `<p>🚫 This account doesn't have admin access.</p><p style="font-size:12px; color:#888;">If this should be an admin account, the site owner needs to add your account UID to the <code>admins</code> collection in Firebase Console.</p>`;
        return;
      }

      gate.style.display = "none";
      dashboard.style.display = "block";
      loadAllPanels();
    }
  });

  // ---- Tabs ----
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
    });
  });

  function esc(s) { return (s || "").toString().replace(/</g, "&lt;"); }
  function timeAgo(iso) {
    if (!iso) return "";
    const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    if (days < 1) return "today";
    if (days === 1) return "1 day ago";
    return `${days} days ago`;
  }

  function loadAllPanels() {
    loadBookings();
    loadWorkerApplications();
    loadFeedback();
    loadReviews();
    loadDonations();
    loadShowcase();
  }

  // ---- Bookings ----
  async function loadBookings() {
    const panel = document.getElementById("panel-bookings");
    try {
      const snap = await getDocs(query(collection(db, "bookings"), orderBy("submittedAt", "desc"), limit(50)));
      if (snap.empty) { panel.innerHTML = `<p class="empty-msg">No bookings yet.</p>`; return; }
      let html = "";
      snap.forEach(d => {
        const b = d.data();
        const services = Object.entries(b.services || {}).map(([cat, list]) => `${cat}: ${list.join(", ")}`).join(" | ");
        html += `
          <div class="item-card">
            <div class="item-row"><strong>${esc(b.customerName || "Customer")}</strong><span>${timeAgo(b.submittedAt)}</span></div>
            <div class="item-row"><span>📍 ${esc(b.address)}</span></div>
            <div class="item-row"><span>📅 ${esc(b.preferredDate)} ${esc(b.preferredTime)}</span><span>₹${b.estimatedTotal || 0}</span></div>
            <div class="item-row"><span>🔧 ${esc(services)}</span></div>
            <div class="item-row"><span>Status: ${esc(b.status || "submitted")}</span><span>${b.assignedWorkerName ? "👷 " + esc(b.assignedWorkerName) : "Unassigned"}</span></div>
          </div>`;
      });
      panel.innerHTML = html;
    } catch (err) {
      panel.innerHTML = `<p class="empty-msg">Couldn't load bookings. ${err.message}</p>`;
    }
  }

  // ---- Worker applications ----
  async function loadWorkerApplications() {
    const panel = document.getElementById("panel-workers");
    try {
      const snap = await getDocs(collection(db, "worker_applications"));
      if (snap.empty) { panel.innerHTML = `<p class="empty-msg">No applications yet.</p>`; return; }
      let html = "";
      snap.forEach(d => {
        const w = d.data();
        const status = w.status || "pending";
        html += `
          <div class="item-card">
            <div class="item-row"><strong>${esc(w.name)}</strong><span class="status-tag status-${status}">${status}</span></div>
            <div class="item-row"><span>${esc(w.trade || w.skill)}</span><span>${esc(w.phone)}</span></div>
            <div class="item-row"><span>${esc(w.idType || "")} ${esc(w.idNumber || "")}</span></div>
            <div class="item-actions">
              <button class="btn-approve" data-id="${d.id}" data-action="approved">Approve</button>
              <button class="btn-reject" data-id="${d.id}" data-action="rejected">Reject</button>
            </div>
          </div>`;
      });
      panel.innerHTML = html;
      panel.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", async () => {
          btn.closest(".item-actions").innerHTML = "Updating…";
          try {
            await updateDoc(doc(db, "worker_applications", btn.dataset.id), { status: btn.dataset.action });
            loadWorkerApplications();
          } catch (err) {
            alert("Failed: " + err.message);
          }
        });
      });
    } catch (err) {
      panel.innerHTML = `<p class="empty-msg">Couldn't load applications. ${err.message}</p>`;
    }
  }

  // ---- Feedback ----
  async function loadFeedback() {
    const panel = document.getElementById("panel-feedback");
    try {
      const snap = await getDocs(query(collection(db, "community_feedback"), orderBy("submittedAt", "desc"), limit(50)));
      if (snap.empty) { panel.innerHTML = `<p class="empty-msg">No feedback yet.</p>`; return; }
      let html = "";
      snap.forEach(d => {
        const f = d.data();
        html += `
          <div class="item-card">
            <div class="item-row"><strong>${esc(f.name)}</strong><span>${timeAgo(f.submittedAt)}</span></div>
            <p style="margin:6px 0 0;">${esc(f.tip)}</p>
          </div>`;
      });
      panel.innerHTML = html;
    } catch (err) {
      panel.innerHTML = `<p class="empty-msg">Couldn't load feedback. ${err.message}</p>`;
    }
  }

  // ---- Reviews (moderation: delete) ----
  async function loadReviews() {
    const panel = document.getElementById("panel-reviews");
    try {
      const snap = await getDocs(query(collection(db, "reviews"), orderBy("submittedAt", "desc"), limit(50)));
      if (snap.empty) { panel.innerHTML = `<p class="empty-msg">No reviews yet.</p>`; return; }
      let html = "";
      snap.forEach(d => {
        const r = d.data();
        html += `
          <div class="item-card">
            <div class="item-row"><strong>${esc(r.name)}</strong><span>${"★".repeat(r.rating || 0)}${"☆".repeat(5 - (r.rating || 0))}</span></div>
            <p style="margin:6px 0;">${esc(r.comment)}</p>
            <div class="item-actions"><button class="btn-delete" data-id="${d.id}">Delete Review</button></div>
          </div>`;
      });
      panel.innerHTML = html;
      panel.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this review?")) return;
          await deleteDoc(doc(db, "reviews", btn.dataset.id));
          loadReviews();
        });
      });
    } catch (err) {
      panel.innerHTML = `<p class="empty-msg">Couldn't load reviews. ${err.message}</p>`;
    }
  }

  // ---- Donations ----
  async function loadDonations() {
    const panel = document.getElementById("panel-donations");
    try {
      const snap = await getDocs(query(collection(db, "donations"), orderBy("donatedAt", "desc"), limit(50)));
      if (snap.empty) { panel.innerHTML = `<p class="empty-msg">No donations yet.</p>`; return; }
      let html = "";
      let total = 0;
      snap.forEach(d => {
        const don = d.data();
        total += don.amount || 0;
        html += `
          <div class="item-card">
            <div class="item-row"><strong>${esc(don.name)}</strong><span>₹${don.amount}</span></div>
            <div class="item-row"><span>${timeAgo(don.donatedAt)}</span></div>
          </div>`;
      });
      panel.innerHTML = `<p style="font-weight:700; margin-bottom:10px;">Total: ₹${total}</p>` + html;
    } catch (err) {
      panel.innerHTML = `<p class="empty-msg">Couldn't load donations. ${err.message}</p>`;
    }
  }

  // ---- Community showcase (moderation: delete) ----
  async function loadShowcase() {
    const panel = document.getElementById("panel-showcase");
    try {
      const snap = await getDocs(query(collection(db, "community_showcase"), orderBy("createdAt", "desc"), limit(50)));
      if (snap.empty) { panel.innerHTML = `<p class="empty-msg">No posts yet.</p>`; return; }
      let html = "";
      snap.forEach(d => {
        const p = d.data();
        html += `
          <div class="item-card">
            <div class="item-row"><strong>${esc(p.name)}</strong><span>${timeAgo(p.createdAt)}</span></div>
            <p style="margin:6px 0;">${esc(p.caption)}</p>
            <div class="item-actions"><button class="btn-delete" data-id="${d.id}">Delete Post</button></div>
          </div>`;
      });
      panel.innerHTML = html;
      panel.querySelectorAll(".btn-delete").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this post?")) return;
          await deleteDoc(doc(db, "community_showcase", btn.dataset.id));
          loadShowcase();
        });
      });
    } catch (err) {
      panel.innerHTML = `<p class="empty-msg">Couldn't load posts. ${err.message}</p>`;
    }
  }
</script>
</body>
</html>
